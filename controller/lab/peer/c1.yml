# Two controllers, c1 for s1 and c2 for s2, agreeing on every key with a
# Diffie-Hellman exchange. c1 (first name) leads the rotations.
name: c1
tls:
  ca: /shared/p4ics/pki/ca.pem
  cert: /shared/p4ics/pki/c1.pem
  key: /shared/p4ics/pki/c1-key.pem
api:
  listen: 100.0.1.11:3333
gui:                            # web GUI, published on the host (make_lab.sh)
  listen: 0.0.0.0:8080
  user: admin
  password_file: /shared/p4ics/gui-password   # created by c1.startup
  topology: /topology.json
keys:
  bits: 256
  rotate: 10m
tunnels:
  mode: static
peer:
  name: c2
  url: https://100.0.1.12:3333
switches:
  - name: s1
    address: 100.0.1.1:50051
    device_id: 1
    json: /shared/p4ics/pipeline/s1.json
    p4info: /shared/p4ics/pipeline/s1.p4info.txtpb
    commands: /shared/p4ics/pipeline/s1.commands.txt
